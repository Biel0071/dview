services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@droidview.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_TOTP: ${ADMIN_TOTP:-123456}
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web-panel/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: droidview
      POSTGRES_PASSWORD: droidview
      POSTGRES_DB: droidview
    ports:
      - "5432:5432"
    volumes:
      - droidview_pg:/var/lib/postgresql/data

volumes:
  droidview_pg:
